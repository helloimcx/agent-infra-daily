<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f9f8">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header shell">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-dot"></span><span>Agent Infra Daily</span>
    </a>
    <nav>
      <a href="{{ '/' | relative_url }}">Latest</a>
      <a href="{{ '/archive/' | relative_url }}">Archive</a>
      <a href="https://github.com/helloimcx/agent-infra-daily">GitHub</a>
    </nav>
  </header>
  <main class="shell">{{ content }}</main>
  <footer class="site-footer shell">
    <span>Focused on infrastructure, not hype.</span>
    <span>Updated daily.</span>
  </footer>
</body>
</html>
